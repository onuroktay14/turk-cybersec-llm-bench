[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersec-llm-bench"
version = "0.1.0"
description = "Head-to-head benchmark for cybersecurity LLMs (Seneca, Titus, et al.) on SOC alerts via Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "cybersec-llm-bench contributors" }]
keywords = [
    "cybersecurity", "llm", "benchmark", "ollama", "soc", "siem",
    "threat-intel", "mitre-attack", "seneca", "titus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
cybersec-llm-bench = "cybersec_llm_bench.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/cybersec-llm-bench"
Issues = "https://github.com/your-org/cybersec-llm-bench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter; tolerate occasional long lines
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
